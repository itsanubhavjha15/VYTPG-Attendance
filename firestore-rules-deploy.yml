name: Deploy Firestore Rules on: push: branches: - main paths: - 'firestore.rules' jobs: deploy_rules: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-node@v4 with: node-version: '20' - run: npm install -g firebase-tools - run: echo '${{ secrets.FIRESTORE_SA_VYTPGDURG }}' > $HOME/gcp-key.json - run: firebase deploy --only firestore:rules --project vytpgdurg env: GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json
add firestore rules auto-deploy
